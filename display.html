```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>آراء عملاء رُفوف</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden !important;
  background: #f8f5ed;
  color: #263d2e;
  font-family: Tahoma, Arial, sans-serif;
}

body {
  overscroll-behavior-x: none;
}

#rufoof {
  display: block;
  width: 100%;
  max-width: 1150px;
  min-width: 0;
  margin: 0 auto;
  padding: 20px 12px 12px;
  overflow: hidden;
}

/* العنوان والإحصائيات */
.heading {
  text-align: center;
  margin: 0 0 22px;
}

.kicker {
  color: #a08040;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}

h2 {
  font-size: clamp(23px, 4vw, 30px);
  margin: 0 0 8px;
  line-height: 1.7;
}

.subtitle {
  font-size: 13px;
  color: #777060;
  line-height: 2;
  margin: 0;
}

/* ملخص التقييمات */
.overview {
  display: grid;
  grid-template-columns: minmax(0, .85fr) minmax(0, 1.35fr);
  gap: 12px;
  margin-bottom: 24px;
  width: 100%;
  min-width: 0;
}

.panel {
  background: #fff;
  border: 1px solid #e8e0d1;
  border-radius: 14px;
  padding: 16px 12px;
  min-width: 0;
  overflow: hidden;
}

.score {
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.label,
.total {
  color: #777060;
  font-size: 12px;
  line-height: 1.9;
}

.number {
  font-size: 40px;
  font-weight: bold;
  line-height: 1.4;
}

.stars {
  direction: ltr;
  color: #b18b43;
  font-size: 17px;
  margin: 5px 0;
}

.dist-title {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 12px;
}

.rating-row {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) 20px;
  gap: 5px;
  align-items: center;
  margin: 11px 0;
  font-size: 10px;
  color: #716b5e;
}

.track {
  height: 7px;
  background: #eee9df;
  border-radius: 20px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: #b18b43;
  width: 0;
  transition: width .25s ease;
}

.count {
  text-align: left;
  direction: ltr;
}

/* قسم التقييمات */
.review-row {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  margin: 0 0 22px;
  overflow: hidden;
}

.list-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e8e0d1;
}

.row-title {
  font-size: 17px;
  font-weight: bold;
  color: #263d2e;
  margin: 0;
}

.latest {
  font-size: 10px;
  color: #a08040;
  white-space: nowrap;
}

/* صف أفقي واحد قابل للسحب */
#rufoof .grid {
  display: flex;
  flex-flow: row nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 14px;

  width: 100%;
  max-width: 100%;
  min-width: 0;
  margin: 0;
  padding: 4px 2px 14px;

  overflow-x: auto;
  overflow-y: hidden;
  direction: rtl;

  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  touch-action: pan-x pan-y;
  scroll-snap-type: x proximity;

  scrollbar-width: thin;
  scrollbar-color: #b18b43 #eee9df;
}

#rufoof .grid::-webkit-scrollbar {
  height: 6px;
}

#rufoof .grid::-webkit-scrollbar-track {
  background: #eee9df;
  border-radius: 10px;
}

#rufoof .grid::-webkit-scrollbar-thumb {
  background: #b18b43;
  border-radius: 10px;
}

/* كروت التقييمات */
.card {
  flex: 0 0 300px;
  width: 300px;
  max-width: 300px;
  min-width: 0;
  height: auto;
  align-self: stretch;

  background: #fff;
  border: 1px solid #e8e0d1;
  border-radius: 13px;
  padding: 14px 12px;

  overflow-wrap: anywhere;
  word-break: normal;
  box-shadow: 0 4px 14px rgba(38, 61, 46, .04);
  scroll-snap-align: start;
}

.person {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
  min-width: 0;
}

.avatar {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  border-radius: 50%;
  background: #263d2e;
  color: #f8f5ed;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}

.person-info {
  min-width: 0;
  flex: 1;
}

.name {
  font-size: 12px;
  font-weight: bold;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.date {
  font-size: 10px;
  color: #938b7b;
  line-height: 1.8;
}

.card-stars {
  direction: ltr;
  text-align: right;
  font-size: 14px;
  color: #b18b43;
  margin-bottom: 7px;
  line-height: 1.8;
  letter-spacing: 1px;
}

.comment {
  font-size: 12px;
  color: #5f5a4e;
  line-height: 2;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: normal;
  display: block;
  height: auto;
  max-height: none;
  overflow: visible;
  text-overflow: clip;
}

/* رسالة التحميل */
.status {
  width: 100%;
  padding: 24px 10px;
  text-align: center;
  font-size: 13px;
  color: #777060;
  line-height: 2;
  flex: 0 0 100%;
}

/* التذييل */
.footer {
  display: block;
  width: 100%;
  margin: 8px 0 0;
  padding: 10px 8px 4px;
  text-align: center;
  font-size: 12px;
  color: #8a806e;
  line-height: 2;
}

.footer span {
  color: #a08040;
  font-weight: bold;
}

/* الكمبيوتر */
@media (min-width: 768px) {
  #rufoof {
    padding: 26px 20px 16px;
  }

  .heading {
    margin-bottom: 26px;
  }

  .overview {
    gap: 16px;
    margin-bottom: 28px;
  }

  .panel {
    padding: 20px 18px;
  }

  #rufoof .grid {
    gap: 16px;
  }

  #rufoof .card {
    flex-basis: 310px;
    width: 310px;
    max-width: 310px;
    padding: 17px 15px;
  }

  .name {
    font-size: 13px;
  }

  .comment {
    font-size: 13px;
  }
}

/* الموبايل */
@media (max-width: 767px) {
  #rufoof {
    padding: 16px 10px 10px;
  }

  .heading {
    margin-bottom: 18px;
  }

  .overview {
    gap: 8px;
    margin-bottom: 20px;
  }

  .panel {
    padding: 13px 8px;
    border-radius: 12px;
  }

  .number {
    font-size: 34px;
  }

  .stars {
    font-size: 14px;
  }

  .rating-row {
    grid-template-columns: 34px minmax(0, 1fr) 17px;
    gap: 3px;
    font-size: 9px;
  }

  .list-heading {
    margin-bottom: 10px;
  }

  .row-title {
    font-size: 15px;
  }

  .latest {
    font-size: 10px;
  }

  #rufoof .grid {
    gap: 10px;
    padding-bottom: 12px;
  }

  #rufoof .card {
    flex: 0 0 82%;
    width: 82%;
    max-width: 82%;
    padding: 12px 10px;
  }

  .name {
    font-size: 12px;
  }

  .comment {
    font-size: 12px;
  }
}

@media (max-width: 380px) {
  #rufoof {
    padding: 14px 8px 10px;
  }

  .overview {
    gap: 7px;
  }

  .panel {
    padding: 12px 7px;
  }

  .number {
    font-size: 31px;
  }

  .rating-row {
    grid-template-columns: 32px minmax(0, 1fr) 16px;
    gap: 3px;
    font-size: 8px;
  }

  #rufoof .grid {
    gap: 8px;
  }

  #rufoof .card {
    flex-basis: 86%;
    width: 86%;
    max-width: 86%;
    padding: 11px 9px;
  }

  .name {
    font-size: 11px;
  }

  .comment {
    font-size: 11px;
  }
}
</style>
</head>

<body>
<main id="rufoof">

  <header class="heading">
    <div class="kicker">RUFOOF REVIEWS</div>
    <h2>آراء عملائنا</h2>
    <p class="subtitle">
      تجاربكم وآراؤكم محل تقديرنا، وثقتكم هي الدافع لتقديم الأفضل.
    </p>
  </header>

  <section class="overview">
    <div class="panel score">
      <div class="label">التقييم العام</div>
      <div class="number" id="average">—</div>
      <div class="stars" id="averageStars">☆☆☆☆☆</div>
      <div class="total" id="totalReviews">جاري تحميل التقييمات...</div>
    </div>

    <div class="panel">
      <div class="dist-title">توزيع التقييمات</div>
      <div id="ratingDistribution"></div>
    </div>
  </section>

  <section class="review-row">
    <div class="list-heading">
      <h3 class="row-title">آراء عملائنا</h3>
      <span class="latest">اسحب لمشاهدة المزيد ←</span>
    </div>

    <div class="grid" id="reviewsTop">
      <div class="status">جاري تحميل الآراء...</div>
    </div>
  </section>

  <div class="footer">
    <span>شكرًا لثقتكم في رُفوف</span>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyDVigJ8j77CaBL_kecRhjof2eRwrjFhlC4",
    authDomain: "rufoof-5274f.firebaseapp.com",
    projectId: "rufoof-5274f",
    storageBucket: "rufoof-5274f.firebasestorage.app",
    messagingSenderId: "649838866242",
    appId: "1:649838866242:web:a2599e88269e7c656262db"
  };

  var topBox = document.getElementById("reviewsTop");

  function showStatus(box, message) {
    box.innerHTML = "";

    var status = document.createElement("div");
    status.className = "status";
    status.textContent = message;

    box.appendChild(status);
  }

  function safeText(value) {
    return value == null ? "" : String(value);
  }

  function formatDate(value) {
    if (!value) return "";

    var date = typeof value.toDate === "function"
      ? value.toDate()
      : new Date(value);

    if (isNaN(date.getTime())) return "";

    return new Intl.DateTimeFormat("ar-EG", {
      year: "numeric",
      month: "short",
      day: "numeric"
    }).format(date);
  }

  function makeStars(rating) {
    var value = Math.max(0, Math.min(5, Number(rating) || 0));
    var rounded = Math.round(value);

    return "★".repeat(rounded) + "☆".repeat(5 - rounded);
  }

  function createCard(review) {
    var card = document.createElement("article");
    card.className = "card";

    var person = document.createElement("div");
    person.className = "person";

    var avatar = document.createElement("div");
    avatar.className = "avatar";

    var name = safeText(review.name).trim() || "عميل رُفوف";
    avatar.textContent = Array.from(name)[0] || "ر";

    var info = document.createElement("div");
    info.className = "person-info";

    var nameElement = document.createElement("div");
    nameElement.className = "name";
    nameElement.textContent = name;

    var date = document.createElement("div");
    date.className = "date";
    date.textContent = formatDate(review.createdAt);

    info.appendChild(nameElement);
    info.appendChild(date);

    person.appendChild(avatar);
    person.appendChild(info);

    var stars = document.createElement("div");
    stars.className = "card-stars";
    stars.textContent = makeStars(review.rating);

    stars.setAttribute(
      "aria-label",
      "التقييم " + Number(review.rating) + " من 5"
    );

    var comment = document.createElement("div");
    comment.className = "comment";
    comment.textContent = safeText(review.comment);

    card.appendChild(person);
    card.appendChild(stars);
    card.appendChild(comment);

    return card;
  }

  function renderDistribution(reviews) {
    var container = document.getElementById("ratingDistribution");
    container.innerHTML = "";

    for (var rating = 5; rating >= 1; rating--) {
      var count = reviews.filter(function (review) {
        return Number(review.rating) === rating;
      }).length;

      var percentage = reviews.length
        ? (count / reviews.length) * 100
        : 0;

      var row = document.createElement("div");
      row.className = "rating-row";

      var label = document.createElement("div");
      label.textContent = rating + " نجوم";

      var track = document.createElement("div");
      track.className = "track";

      var fill = document.createElement("div");
      fill.className = "fill";
      fill.style.width = percentage + "%";

      track.appendChild(fill);

      var countElement = document.createElement("div");
      countElement.className = "count";
      countElement.textContent = String(count);

      row.appendChild(label);
      row.appendChild(track);
      row.appendChild(countElement);

      container.appendChild(row);
    }
  }

  /* جميع التقييمات في صف أفقي واحد */
  function renderReviews(reviews) {
    topBox.innerHTML = "";

    if (!reviews.length) {
      showStatus(topBox, "لا توجد تقييمات منشورة حتى الآن.");
      return;
    }

    reviews.forEach(function (review) {
      topBox.appendChild(createCard(review));
    });
  }

  function renderSummary(reviews) {
    var total = reviews.length;

    var average = total
      ? reviews.reduce(function (sum, review) {
          return sum + Number(review.rating);
        }, 0) / total
      : 0;

    document.getElementById("average").textContent =
      total ? average.toFixed(1) : "—";

    document.getElementById("averageStars").textContent =
      total ? makeStars(average) : "☆☆☆☆☆";

    document.getElementById("totalReviews").textContent =
      total + (total === 1 ? " تقييم" : " تقييمات");

    renderDistribution(reviews);
  }

  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    var db = firebase.firestore();

    db.collection("reviews")
      .orderBy("createdAt", "desc")
      .get()
      .then(function (snapshot) {
        var reviews = [];

        snapshot.forEach(function (doc) {
          var data = doc.data();

          if (
            data &&
            typeof data.name === "string" &&
            typeof data.comment === "string" &&
            Number(data.rating) >= 1 &&
            Number(data.rating) <= 5 &&
            data.comment.trim().length > 0
          ) {
            reviews.push(data);
          }
        });

        renderSummary(reviews);
        renderReviews(reviews);
      })
      .catch(function (error) {
        console.error("Rufoof reviews loading error:", error);

        showStatus(
          topBox,
          "تعذر تحميل التقييمات. حاول تحديث الصفحة."
        );

        document.getElementById("totalReviews").textContent =
          "تعذر تحميل التقييمات";
      });

  } catch (error) {
    console.error("Firebase initialization error:", error);

    showStatus(
      topBox,
      "تعذر الاتصال بنظام التقييمات."
    );
  }
})();
</script>

</body>
</html>
```
